[CoreRedirects]
; The anim graph node moved from the Editor-type module to the UncookedOnly
; module so uncooked -game runs can load the crowd anim blueprints (Editor
; modules never load there). Existing assets import the class from the old
; script package; redirect them to the new one.
+ClassRedirects=(OldName="/Script/RammsCrowdEditor.AnimGraphNode_RammsFootPlacement",NewName="/Script/RammsCrowdUncooked.AnimGraphNode_RammsFootPlacement")
